# Config for lycheeverse/lychee-action (weekly link check workflow)

# Resolve root-relative links (e.g. /Images/foo.png) against the repo root.
root_dir = "."

exclude = [
  # Illustrative placeholder URL used in Git.md examples, not a real repo.
  "https://github.com/your-username/repository-name",
  # Local-only Kubernetes dashboard link, never reachable from CI.
  "http://localhost:8001",
]

# `accept` replaces lychee's default status list rather than extending it, so the normal
# 200-299 success range must be listed explicitly alongside the 403 workaround below.
# npm returns 403 to lychee's bot user agent for this package page even though it's live.
accept = ["200..=299", "403"]
